{% extends "base.html" %}
{% block titulo %}Disciplinas — Sistema de Gerenciamento{% endblock %}
{% block pagina %}disciplinas-lista{% endblock %}

{% block conteudo %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h1 class="h3 mb-0">Disciplinas</h1>
  <a href="{{ url_for('views.disciplina_nova') }}" class="btn btn-primary">+ Nova disciplina</a>
</div>

<div class="table-responsive">
  <table class="table table-striped table-hover align-middle">
    <caption class="sr-only">Lista de disciplinas cadastradas</caption>
    <thead class="table-dark">
      <tr>
        <th scope="col">Nome</th>
        <th scope="col">Descrição</th>
        <th scope="col">Carga horária</th>
        <th scope="col">Professores</th>
        <th scope="col">Ações</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela"></tbody>
  </table>
</div>
{% endblock %}

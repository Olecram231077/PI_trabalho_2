{% extends "base.html" %}
{% block titulo %}Disciplina — Sistema de Gerenciamento{% endblock %}
{% block pagina %}disciplina-form{% endblock %}

{% block conteudo %}
<h1 class="h3 mb-4" id="titulo-form">Nova disciplina</h1>

<form id="form-disciplina" data-disciplina-id="{{ disciplina_id or '' }}" novalidate>
  <div class="row g-3 mb-4">
    <div class="col-md-8">
      <label for="nome" class="form-label">Nome da disciplina <span aria-hidden="true">*</span></label>
      <input type="text" class="form-control" id="nome" name="nome" required aria-required="true">
    </div>

    <div class="col-md-4">
      <label for="carga_horaria" class="form-label">Carga horária (horas)</label>
      <input type="number" class="form-control" id="carga_horaria" name="carga_horaria" min="1" step="1">
    </div>

    <div class="col-12">
      <label for="descricao" class="form-label">Descrição</label>
      <textarea class="form-control" id="descricao" name="descricao" rows="3"></textarea>
    </div>
  </div>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="{{ url_for('views.disciplinas') }}" class="btn btn-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}

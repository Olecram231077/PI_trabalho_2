<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistema web de gerenciamento de professores, disciplinas e substituições para escolas.">
  <title>{% block titulo %}Sistema de Gerenciamento de Professores{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-pagina="{% block pagina %}generica{% endblock %}">

  <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>

  <div id="regiao-anuncios" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary" aria-label="Navegação principal">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('views.index') }}">
          <span aria-hidden="true">🏫</span> Escola Manager
        </a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu-principal"
                aria-controls="menu-principal" aria-expanded="false"
                aria-label="Abrir menu de navegação">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu-principal">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="{{ url_for('views.index') }}">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('views.professores') }}">Professores</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('views.disciplinas') }}">Disciplinas</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('views.substituicoes') }}">Substituições</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main id="conteudo-principal" class="container my-4" tabindex="-1">
    <div id="area-alertas" role="status" aria-live="polite"></div>
    {% block conteudo %}{% endblock %}
  </main>

  <footer class="bg-light py-3 mt-auto">
    <div class="container text-center text-muted">
      <p class="mb-0">Sistema de Gerenciamento de Professores — Projeto Integrador II — UNIVESP 2026</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/acessibilidade.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
